[audio]
enable_sounds = true

[bar.default]
background_opacity = 0.24999999441206455
border = "tertiary"
border_width = 1.0
concave_edge_corners = false
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "control-center",
    "session"
]
font_family = "ComicShannsMono Nerd Font"
font_weight = 700
margin_ends = 0
radius = 55
start = [ "launcher", "wallpaper", "workspaces", "active_window" ]
thickness = 30

[control_center.calendar]
show_week_numbers = true

[dock]
background_opacity = 0.0
border = "primary"
concave_edge_corners = false
cross_axis_padding = 4
enabled = false
icon_size = 36
inactive_opacity = 0.99999997764825821
inactive_scale = 1.0
launcher_position = "end"
margin_edge = 0
pinned = [ "org.wezfurlong.wezterm", "firefox", "codium" ]
position = "left"
radius = 20
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.launcher]
app_grid = true

[shell.panel]
transparency_mode = "glass"

[shell.screenshot]
save_to_file = false

[theme]
builtin = "Noctalia"
community_palette = "Cyberpunk"
mode = "dark"
source = "community"
wallpaper_scheme = "vibrant"

[wallpaper]
directory = "/home/cubos/Pictures/Caratulas"

    [wallpaper.default]
    path = "/home/cubos/Pictures/Caratulas/FateStay_Night/fate_default.jpg"

    [wallpaper.last]
    path = "/home/cubos/Pictures/Caratulas/FateStay_Night/fate_default.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/cubos/Pictures/Caratulas/FateStay_Night/fate_default.jpg"

[widget.bluetooth]
icon_color = "#0E3BFF"

[widget.clipboard]
icon_color = "#CBD3FB"

[widget.control-center]
color = "#11E70E"

[widget.network]
color = "#C2B226"

[widget.notifications]
icon_color = "tertiary"

[widget.session]
capsule = true
capsule_fill = "#520371"
capsule_opacity = 0.54000000000000004
capsule_padding = 10
capsule_radius = "auto"
icon_color = "#FF1B4F"

[widget.volume]
color = "#1FE8E4"
icon_color = "#1FE8E4"

[widget.workspaces]
font_family = "ComicShannsMono Nerd Font"
font_weight = 700
